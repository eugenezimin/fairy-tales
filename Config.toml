# Application configuration.
# Override path with: APP_CONFIG=/path/to/file.toml cargo run
# Or pass as CLI arg:  cargo run -- /path/to/file.toml

[server]
host = "127.0.0.1"
port = 3000
secure_cookies = false

[server.static_source]
kind = "local" # "local" or "github"
source = "static" #"https://github.com/eugenezimin/fairy-tales/tree/main/static" # URL to the directory containing static files or GitHub repo URL


[site]
title = "Между строк"
page_title = "Невыдуманне истории настоящей жизни"
footer_year = 2026
language = "cyr" # ISO 639-1 code, e.g. "en", "ru", "es"

# Optional footer overrides:
[site.footer]
# text = "Custom HTML footer"          # overrides everything
copyright = "© 2026 by RealStories"              # overrides just the © line
# links = [
#   { label = "Privacy", href = "/privacy" },
#   { label = "Terms",   href = "/terms"   },
# ]

[content]
# Every .toml file in this directory is treated as a separate article.
dir = "content"

[theme]
# Maps to static/css/theme-{name}.css
name = "light"

[admin]
# Set a strong random value here, or override with APP_ADMIN_TOKEN env var
#token = "change-me-before-deploy"

[pagination]
enabled = true
symbol_limit = 10000