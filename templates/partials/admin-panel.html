<div id="admin-panel">
    <div id="admin-panel__inner">
        <h2>{{ strings["upload_article"] }}</h2>
        <div id="admin-dropzone">
            <div id="admin-dropzone-prompt">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p>Drop a <code>.md</code> file and any images here</p>
            </div>
            <ul id="admin-file-list"></ul>
        </div>
        <div id="admin-status-bar">
            <span id="admin-status-icon"></span>
            <span id="admin-status"></span>
        </div>
        <div id="admin-actions">
            <label id="admin-file-label">
                Choose files
                <input type="file" id="admin-file" accept=".md,image/*" multiple>
            </label>
            <button id="admin-submit" disabled>Publish</button>
            <button id="admin-close">Cancel</button>
        </div>
    </div>
</div>
