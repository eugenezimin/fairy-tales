<ul class="story-list">
    {% for story in stories %}
    <li class="story-list__item">
        <a href="/article/{{ story.slug }}" class="story-list__link">
            <span class="story-list__title">{{ story.title }}</span>
            <span class="story-list__snippet">{{ story.snippet }}</span>
        </a>
    </li>
    {% endfor %}
</ul>
