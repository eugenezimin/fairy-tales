<div class="mobile-stories-drawer" id="mobile-stories-drawer" aria-hidden="true">
    <div class="mobile-stories-drawer__inner">

        <p class="mobile-drawer-section-title">Other stories</p>
        {% include "partials/drawer-stories.html" %}

        {% if !toc.is_empty() %}
        <div class="mobile-drawer-toc-section">
            <div class="mobile-toc-toggle" id="mobile-toc-toggle"
                 role="button" tabindex="0"
                 aria-expanded="false" aria-controls="mobile-toc-list">
                Contents
                <span class="mobile-toc-toggle__arrow">▸</span>
            </div>
            {% include "partials/drawer-toc.html" %}
        </div>
        {% endif %}

    </div>
</div>

<div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>
