<header class="site-header">
    <div class="site-header__inner">
        <h1 class="site-header__title">
            <a href="/" style="color:inherit;text-decoration:none;">{{ site_title }}</a>
        </h1>

        <nav class="site-header__nav" id="main-nav">
            {% if content == "admin" %}
                <a href="/">← Back to site</a>
                <a href="/admin/logout">Log Out</a>
            {% else %}
                <a href="#">About</a>
                {% if is_admin %}
                    <a href="/admin">Articles</a>
                    <a href="#" id="upload-trigger">Upload Article</a>
                    <a href="/admin/logout">Log Out</a>
                {% endif %}
            {% endif %}
        </nav>

        {% if content == "article" %}
        <button class="hamburger-btn" id="hamburger-btn"
                aria-label="Toggle menu" aria-expanded="false"
                aria-controls="mobile-stories-drawer">
            <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" y1="4" x2="20" y2="20" />
                <line x1="20" y1="4" x2="4" y2="20" />
            </svg>
        </button>
        {% endif %}
    </div>
</header>
